<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付スキャン</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #1a73e8; color: white; padding: 14px 16px; font-size: 16px; font-weight: 600; }
  .container { padding: 16px; max-width: 480px; margin: 0 auto; }
  #preview { width: 100%; border-radius: 12px; background: #000; display: block; }
  .result { margin-top: 16px; padding: 20px; border-radius: 12px; text-align: center; font-size: 18px; font-weight: 600; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .idle { background: #e8eaed; color: #5f6368; }
  .ok { background: #e6f4ea; color: #137333; border: 2px solid #34a853; }
  .ng { background: #fce8e6; color: #c5221f; border: 2px solid #ea4335; }
  .warn { background: #fef7e0; color: #b06000; border: 2px solid #fbbc04; }
  .sub { font-size: 14px; font-weight: 400; margin-top: 4px; }
  .btn { display: block; width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-blue { background: #1a73e8; color: white; }
  .btn-gray { background: #e8eaed; color: #333; }
  .manual { display: flex; gap: 8px; margin-top: 16px; }
  .manual input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .manual button { padding: 10px 16px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .count { text-align: center; padding: 12px; background: white; border-radius: 8px; margin-top: 12px; font-size: 13px; color: #666; }
  .count b { font-size: 20px; color: #1a73e8; }
  #debug { background: #fff3cd; border-radius: 8px; padding: 10px; margin-top: 12px; font-size: 11px; font-family: monospace; word-break: break-all; display: none; }
</style>
</head>
<body>
<div class="header">📷 受付スキャン</div>
<div class="container">

  <video id="preview" autoplay muted playsinline></video>

  <div id="result" class="result idle">カメラ起動ボタンを押してください</div>

  <button class="btn btn-blue" onclick="startCamera()">カメラ起動</button>
  <button class="btn btn-gray" onclick="stopCamera()">停止</button>

  <div class="count">チェックイン済: <b id="cnt">—</b> 人</div>

  <div class="manual">
    <input id="mid" placeholder="ID手入力でチェックイン">
    <button onclick="doCheckin(document.getElementById('mid').value.trim())">送信</button>
  </div>

  <div id="debug"></div>
</div>

<script>
// ここを自分のGASデプロイURLに書き換えてください
const API = 'https://script.google.com/macros/s/AKfycbwXBPSKFGhNmhohk9ervGcaRKqNkqxm8tQaM2-dTfjP2iHB1A3CjnxR0fz8f7v-CXresw/exec';

let scanning = false;
let lastId = '';
let lastTime = 0;
let stream = null;
let animFrame = null;

// QRコードデコーダー（ZXing使用）
async function loadDecoder() {
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.20.0/zxing.min.js';
    script.onload = () => resolve(true);
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}

let codeReader = null;

async function startCamera() {
  const el = document.getElementById('result');
  el.className = 'result idle';
  el.innerHTML = 'カメラを起動中...';

  try {
    // ZXingを使ってQRコードを読み取る
    if (!window.ZXing) {
      await loadDecoder();
    }

    if (window.ZXing) {
      // ZXingが使える場合
      const hints = new Map();
      const formats = [window.ZXing.BarcodeFormat.QR_CODE];
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
      codeReader = new window.ZXing.BrowserQRCodeReader(hints);

      const devices = await window.ZXing.BrowserCodeReader.listVideoInputDevices();
      const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment')) || devices[devices.length - 1];
      const deviceId = backCamera ? backCamera.deviceId : undefined;

      codeReader.decodeFromVideoDevice(deviceId, 'preview', (result, err) => {
        if (result) {
          doCheckin(result.getText());
        }
      });

      el.className = 'result idle';
      el.innerHTML = 'QRコードをカメラに向けてください';
      updateCount();

    } else {
      // ZXingが使えない場合はjsQRにフォールバック
      fallbackToJsQR();
    }

  } catch(e) {
    showDebug('ZXingエラー: ' + e.message);
    fallbackToJsQR();
  }
}

function fallbackToJsQR() {
  const el = document.getElementById('result');
  showDebug('jsQRにフォールバック中...');

  // jsQRを動的に読み込む
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
  script.onload = () => {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(s => {
      stream = s;
      const v = document.getElementById('preview');
      v.srcObject = s;
      v.play();
      scanning = true;
      el.className = 'result idle';
      el.innerHTML = 'QRコードをカメラに向けてください';
      document.getElementById('debug').style.display = 'none';
      scanWithJsQR();
      updateCount();
    }).catch(err => {
      el.className = 'result ng';
      el.innerHTML = 'カメラエラー: ' + err.message;
    });
  };
  document.head.appendChild(script);
}

function scanWithJsQR() {
  if (!scanning) return;
  const v = document.getElementById('preview');
  if (v.readyState === v.HAVE_ENOUGH_DATA && v.videoWidth > 0) {
    const canvas = document.createElement('canvas');
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(v, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });
    if (code && code.data) {
      doCheckin(code.data);
    }
  }
  animFrame = setTimeout(scanWithJsQR, 300);
}

function stopCamera() {
  scanning = false;
  if (animFrame) clearTimeout(animFrame);
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.getElementById('preview').srcObject = null;
  document.getElementById('result').className = 'result idle';
  document.getElementById('result').innerHTML = 'カメラ起動ボタンを押してください';
}

async function doCheckin(id) {
  if (!id) return;
  if (id === lastId && Date.now() - lastTime < 3000) return;
  lastId = id;
  lastTime = Date.now();

  const el = document.getElementById('result');
  el.className = 'result idle';
  el.innerHTML = '処理中...';

  try {
    const url = `${API}?action=checkin&id=${encodeURIComponent(id)}`;
    const r = await fetch(url, {
      method: 'GET',
      mode: 'cors',
      redirect: 'follow'
    });
    const text = await r.text();
    const d = JSON.parse(text);

    if (d.ok) {
      el.className = 'result ok';
      el.innerHTML = `✅ チェックイン完了<div class="sub">${d.name} さん</div><div class="sub" style="font-size:12px">${d.program}</div>`;
      updateCount();
    } else if (d.reason === 'already') {
      el.className = 'result warn';
      el.innerHTML = `⚠️ チェックイン済み<div class="sub">${d.name} さん（${d.program}）</div>`;
    } else {
      el.className = 'result ng';
      el.innerHTML = `❌ 見つかりません<div class="sub">ID: ${id}</div>`;
    }
    document.getElementById('mid').value = '';
    setTimeout(() => {
      el.className = 'result idle';
      el.innerHTML = 'QRコードをカメラに向けてください';
    }, 4000);

  } catch(e) {
    el.className = 'result ng';
    el.innerHTML = '通信エラー';
    showDebug('fetchエラー: ' + e.message + ' / URL: ' + API);
  }
}

async function updateCount() {
  try {
    const r = await fetch(`${API}?action=status`, { mode: 'cors', redirect: 'follow' });
    const d = await r.json();
    document.getElementById('cnt').textContent = d.checked;
  } catch(e) {}
}

function showDebug(msg) {
  const el = document.getElementById('debug');
  el.style.display = 'block';
  el.textContent = msg;
}
</script>
</body>
</html>
